name = "jarx"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Not secrets: the web client ID is public by design, and the owner's email
# only decides who may open /admin.
[vars]
GOOGLE_CLIENT_ID = "269249413715-d5fb6ac76r9jngrmfadrk4oausldiv22.apps.googleusercontent.com"
ADMIN_EMAIL = "arnavjaiswal.aj@gmail.com"
# "on": new accounts wait until the owner approves them on /admin.
APPROVAL = "on"
# JARX AI (src/ai.js): chat messages per person per day, mood-tag AI calls
# per person per day, and the models (change them here when a provider
# renames one). Keys are secrets, never here:
#   npx wrangler secret put GROQ_KEY   /   npx wrangler secret put OPENROUTER_KEY
AI_DAILY_LIMIT = "100"
AI_TAG_LIMIT = "300"
GROQ_MODEL = "openai/gpt-oss-120b"
OPENROUTER_MODEL = "openrouter/free"
CF_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

# Cloudflare's own AI: the last fallback, free, needs no key.
[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "jarx"
database_id = "ad415196-419e-47b8-a74a-9871ce8a3400"

# 300 requests a minute per address (Cloudflare's free rate limiter).
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 300
  period = 60
